      POSTGRES_DB: evidence_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: sovereign2026
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evidence_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: sovereign2026
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:sovereign2026@postgres:5432/evidence_db
    ports:
      - "3000:3000"

  frontend:
    image: nginx:alpine
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres-data:


